name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The default torch wheel pulls about 4 GB of CUDA libraries, which do not
      # fit on the runner next to the test dependencies. The suite runs on CPU,
      # so install the CPU build first; pip then keeps it.
      - name: Install CPU torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project test dependencies
        run: python -m pip install -e ".[dev]"
      # huggingface.co can answer shared runner addresses with HTTP 429. A test
      # that waits out the retry header then hits the 120 s timeout. So:
      #  1. keep the Hugging Face folder in the cache;
      #  2. fetch the two tiny test models up front, with retries;
      #  3. rerun a test only when it failed on that timeout (a real failure is never rerun);
      #  4. use HF_TOKEN when it is set as a secret; empty and ignored otherwise.
      # To refresh the cached files, bump the suffix of the cache key.
      - name: Cache the Hugging Face folder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-safetune-v1
      - name: Fetch the tiny test models, with retries
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import time
          from huggingface_hub import snapshot_download
          for repo in ("hf-internal-testing/tiny-random-LlamaForCausalLM",
                       "hf-internal-testing/tiny-random-GPT2LMHeadModel"):
              for attempt in range(1, 8):
                  try:
                      snapshot_download(repo)
                      break
                  except Exception as e:
                      print(f"{repo} attempt {attempt} failed: {type(e).__name__}")
                      if attempt == 7:
                          raise
                      time.sleep(30 * attempt)
          PY
      - name: Run project test suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          pytest tests/ -m "not slow and not gpu and not unsloth and not wandb" --timeout=120
          --reruns 2 --reruns-delay 15 --only-rerun "Timeout"

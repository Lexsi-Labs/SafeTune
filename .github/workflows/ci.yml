name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # The default torch wheel pulls about 4 GB of CUDA libraries, which do not
      # fit on the runner next to the test dependencies. The suite runs on CPU,
      # so install the CPU build first; pip then keeps it.
      - name: Install CPU torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project test dependencies
        run: python -m pip install -e ".[dev]"
      # huggingface.co can answer shared runner addresses with HTTP 429. A test
      # that waits out the retry header then hits the 120 s timeout. So:
      #  1. keep the Hugging Face folder in the cache;
      #  2. fetch the two tiny test models up front, with retries;
      #  3. rerun a test only when it failed on that timeout (a real failure is never rerun);
      #  4. use HF_TOKEN when it is set as a secret; empty and ignored otherwise.
      # To refresh the cached files, bump the suffix of the cache key.
      - name: Cache the Hugging Face folder
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-safetune-v1
      - name: Fetch the tiny test models, with retries
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import time
          from huggingface_hub import snapshot_download
          for repo in ("hf-internal-testing/tiny-random-LlamaForCausalLM",
                       "hf-internal-testing/tiny-random-GPT2LMHeadModel"):
              for attempt in range(1, 8):
                  try:
                      snapshot_download(repo)
                      break
                  except Exception as e:
                      print(f"{repo} attempt {attempt} failed: {type(e).__name__}")
                      if attempt == 7:
                          raise
                      time.sleep(30 * attempt)
          PY
      - name: Run project test suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          pytest tests/ -m "not slow and not gpu and not unsloth and not wandb" --timeout=120
          --reruns 2 --reruns-delay 15 --only-rerun "Timeout"

  # The seccomp filter and the Landlock rules are kernel features, so they are tested on two live kernels, x86_64
  # and aarch64 (GitHub's free Arm runner for public repositories). SAFETUNE_EXPECT_ISOLATION=1 makes the module
  # fail, and turns any other skip in it into a failure, if a layer is not active on the runner, instead of
  # skipping the tests that need it.
  confinement:
    name: confinement tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # Same CPU torch as the test suite above (the tests import safetune, which imports torch). Then only what the
      # three test files import (found by installing into an empty environment until `import safetune.rewards.code`
      # and the tests ran), with the project's own version bounds; numpy is there so the numpy case runs.
      - name: Install CPU torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install what the confinement tests import
        run: >-
          python -m pip install numpy pytest pytest-timeout tqdm psutil
          "transformers>=5.15,<6" "datasets>=2.14.0,<6"
      - name: Install the package without its other dependencies
        run: python -m pip install -e . --no-deps
      - name: Show the kernel and the isolation it offers
        run: |
          uname -srm
          cat /sys/kernel/security/lsm || true
          python -P - <<'PY'
          import json, os, subprocess, sys
          from safetune.rewards import _code_confine as c
          out = subprocess.run([sys.executable, "-I", "-c", c.ISOLATE_SOURCE + "import json\nprint(json.dumps(isolate(os.getcwd(), False)))"],
                               capture_output=True, text=True, cwd="/tmp").stdout
          print("child isolation (seccomp, Landlock ABI, caps_dropped):", out.strip().splitlines()[-1:])
          PY
      - name: Run the confinement tests
        env:
          SAFETUNE_EXPECT_ISOLATION: "1"
        run: >-
          pytest tests/runtime/test_code_rewards.py tests/runtime/test_mbpp_one_child.py
          tests/runtime/test_code_confinement.py -p no:cacheprovider -rs --timeout=300

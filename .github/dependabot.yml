version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    # Major action versions can change inputs (e.g. slack-github-action v4); bump those by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
